[project]
name = "n409-ai"
version = "0.1.0"
description = "409.ai rebuild — AI service. M1: missing-data / extraction / comparables pipelines via OpenRouter."
requires-python = ">=3.12"
# Kept in step with requirements.txt, which is what CI, the Dockerfile and
# infra/deploy.sh actually install from — and which carries the reasoning for
# each floor. `dependencyCensus.test.ts` fails if the two lists diverge.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    # 6.15.0 fixed PYSEC-2026-3655/3656; 6.21.2 (R448) is the first release
    # clear of the later batch too. All reachable through the text extraction
    # `documents.py` runs over uploaded files.
    "pypdf>=6.21.2",
    # Imported directly by app code (pydantic in app/main.py, starlette in
    # app/errors.py, anyio in app/limits.py) and, before R195, declared nowhere.
    "pydantic>=2.9",
    "starlette>=0.46",
    "anyio>=4.14.2",
    # Imported by tools/check_installed_deps.py, which infra/deploy.sh runs as
    # its preflight gate using this venv's interpreter. It reached the tool only
    # as a pytest transitive, and pytest is not on the deploy host.
    "packaging>=24.0",
    # Security floor on a transitive (httpx/httpcore), not an import: see the
    # certifi block in requirements.txt (PYSEC-2026-4320).
    "certifi>=2026.10.18",
]

[dependency-groups]
# Mirrors requirements-dev.txt.
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
